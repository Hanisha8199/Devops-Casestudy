<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PureBites | Admin Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: #111827; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4 p-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-server me-2"></i> PureBites Database Records</a>
            <a href="/" class="btn btn-outline-light btn-sm">Back to Portal</a>
        </div>
    </nav>

    <div class="container">
        <div class="card p-4">
            <h4 class="mb-4">Logged Adulteration Reports</h4>
            <table class="table table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Brand</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in reports %}
                    <tr>
                        <td>{{ row[0] }}</td>
                        <td><span class="badge bg-primary">{{ row[1] }}</span></td>
                        <td>{{ row[2] }}</td>
                        <td class="text-muted">{{ row[3] }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">No reports logged in the database yet.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
